<!doctype html><meta charset="utf-8"><title>2両編成確認</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><pre id="result">確認中</pre><script type="module">
import * as THREE from 'three';import {createWorld} from '../src/map/world.js';import {createCity} from '../src/map/city.js';import {createCamera} from '../src/camera.js';
try{const out=[],check=(ok,s)=>{if(!ok)throw Error(s);out.push('PASS '+s);};const scene=new THREE.Scene();createWorld(scene);const city=await createCity(scene),trains=city.viaduct.trains;
for(const train of [trains.horizontal,trains.vertical]){const axis=train.axis;check(train.cars.length===2,train.role+' two A carriages');check(train.cars.every(c=>Math.abs(c.scale.x-.95)<1e-8&&c.scale.x===c.scale.y&&c.scale.y===c.scale.z),'uniform .95 unchanged');scene.updateMatrixWorld(true);const bounds=train.cars.map(c=>new THREE.Box3().setFromObject(c,true)).sort((a,b)=>a.min[axis]-b.min[axis]);check(Math.abs(bounds[1].min[axis]-bounds[0].max[axis]-.12)<1e-5,'rear coupling gap .12, no overlap');
for(const car of train.cars){const front=car.getObjectByName('wheels-front').getWorldPosition(new THREE.Vector3()),back=car.getObjectByName('wheels-back').getWorldPosition(new THREE.Vector3()),center=new THREE.Box3().setFromObject(car,true).getCenter(new THREE.Vector3()),origin=train.root.getWorldPosition(new THREE.Vector3());check(front.sub(back).dot(center.sub(origin))>0,'cab faces outward');let maps=0;car.traverse(o=>{if(o.isMesh&&o.material.map?.image?.width)maps++;});check(maps>0,'texture loaded');}
const deck=city.viaduct.root.getObjectByName(axis==='x'?'horizontal-deck-3':'vertical-deck-3'),deckBounds=new THREE.Box3().setFromObject(deck,true);
for(let i=0;i<4000;i++){train.update(.05);scene.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(train.root,true);if(b.min.x<deckBounds.min.x||b.max.x>deckBounds.max.x||b.min.z<deckBounds.min.z||b.max.z>deckBounds.max.z)throw Error('train outside deck');if(Math.abs(b.min.y-city.volumes.deck.railTop)>1e-5)throw Error('rail height changed');}
check(true,'200 seconds shuttle contained on deck at rail height');out.push('length '+train.length.toFixed(3)+' / width '+train.width.toFixed(3));}
scene.background=new THREE.Color(0xe6e8e6);scene.add(new THREE.HemisphereLight(0xf4f8ff,0xb5ada0,2.2));const sun=new THREE.DirectionalLight(0xfff5e7,3);sun.position.set(-15,30,20);scene.add(sun);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(620,440);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;const rig=createCamera();rig.resize(620,440);
for(const train of [trains.horizontal,trains.vertical]){train.root.position[train.axis]=train.min+1;rig.follow(train.root.position.clone().add(new THREE.Vector3(0,0,-2)));renderer.render(scene,rig.camera);const canvas=document.createElement('canvas');canvas.width=620;canvas.height=440;canvas.getContext('2d').drawImage(renderer.domElement,0,0);document.body.append(canvas);}document.querySelector('#result').textContent=out.join('\n');}catch(e){document.querySelector('#result').textContent='FAIL '+e.stack;}
</script>
