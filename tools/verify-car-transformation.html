<!doctype html><html lang="ja"><meta charset="utf-8"><title>外周オートドライブ検証</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<pre id="result">検証中</pre><script type="module">
import * as THREE from 'three';
import {createWorld,groundType,X_EDGES,Z_EDGES} from '../src/map/world.js';
import {createCity} from '../src/map/city.js';
import {createPlayer} from '../src/player/player.js';
import {createCamera} from '../src/camera.js';
import {createCarTransformation,CAR_SETTINGS} from '../src/player/car-transformation.js';
const out=[],check=(ok,label)=>{if(!ok)throw Error(label);out.push('PASS '+label);};
try{
const scene=new THREE.Scene();createWorld(scene);const city=await createCity(scene),rig=createCamera(),p=await createPlayer(scene,rig.camera),target=city.volumes.deck.source.sedan.placement;
const original=target.position.clone(),rotation=target.quaternion.clone(),c=createCarTransformation(scene,p,rig.camera,target);
const key=(type,code)=>window.dispatchEvent(new KeyboardEvent(type,{code,key:code.startsWith('Arrow')?code:code.slice(3).toLowerCase()}));
const tick=(seconds)=>{let time=seconds;while(time>1e-9){const dt=Math.min(.02,time);p.update(dt);c.update(dt);rig.follow(p.position,dt,c.mode!=='walk');time-=dt;}};
const approach=()=>{const b=new THREE.Box3().setFromObject(target,true),v=b.getCenter(new THREE.Vector3());v.z=b.max.z+.7;p.setPosition(v);tick(.02);};
let area=0;for(let i=0;i<1000;i++){
 const a=c.route.point(i*c.route.length/1000),b=c.route.point((i+1)*c.route.length/1000),col=X_EDGES.findIndex((x,j)=>a.x>=x&&a.x<X_EDGES[j+1]),row=Z_EDGES.findIndex((z,j)=>a.z>=z&&a.z<Z_EDGES[j+1]);
 check(groundType(col,row)==='road'||row===10,'route road sample '+i);area+=a.x*b.z-b.x*a.z;
 const ta=c.route.tangent(i*c.route.length/1000),tb=c.route.tangent((i+1)*c.route.length/1000);if(ta.angleTo(tb)>.09)throw Error('heading discontinuity');
}
out.length=0;check(area<0,'counterclockwise road route / continuous corners and loop seam');
const tap=code=>{key('keydown',code);key('keyup',code);};
const near=(a,b)=>Math.abs(a-b)<1e-6;
check(near(c.route.point(0).z,Z_EDGES[13]+4.6/2-(4.6-1.7)/4),'left lane centre on south road');
for(let cycle=0;cycle<2;cycle++){
 approach();check(c.discover.visible,'nearby prompt');tap('KeyE');tick(.66);check(c.mode==='car'&&c.speed===5&&c.stage===2&&!target.visible,'standard speed after transformation');
 tick(2);const orientation=rig.camera.quaternion.clone();
 key('keydown','ArrowUp');tick(.1);check(c.speed>5&&c.speed<8,'immediate smooth response');tick(.3);
 window.dispatchEvent(new KeyboardEvent('keydown',{code:'ArrowUp',key:'ArrowUp',repeat:true}));tick(.5);key('keyup','ArrowUp');check(c.stage===3&&c.speed===8,'one press high / hold and repeat ignored');
 tick(c.route.length/c.speed*2);check(c.mode==='car'&&c.speed===8,'two uninterrupted counterclockwise laps');
 check(rig.camera.quaternion.angleTo(orientation)<1e-6&&Math.abs(rig.camera.zoom-1/1.12)<.001,'camera direction and zoom preserved');
 tap('KeyE');check(c.mode==='car','moving exit blocked');
 tap('ArrowDown');tick(.3);check(c.stage===2&&c.speed===5,'high to standard in one press');
 key('keydown','ArrowDown');tick(.3);window.dispatchEvent(new KeyboardEvent('keydown',{code:'ArrowDown',repeat:true}));tick(1);key('keyup','ArrowDown');check(c.stage===0&&c.speed===0&&c.revert.visible,'standard to stop / holding does not reverse');
 const stop=p.position.clone();tick(.3);check(p.position.distanceTo(stop)<1e-7,'stable stopped position');
 tap('ArrowDown');tick(1);check(c.speed===-.35&&p.position.distanceTo(stop)>.1&&!c.revert.visible,'slow reverse');
 tap('ArrowUp');tick(.3);check(c.stage===0&&c.speed===0,'reverse up stops');
 const reverseStart=p.position.clone();tap('ArrowDown');tick(10);check(c.stage===0&&c.speed===0&&p.position.distanceTo(reverseStart)<=1.501,'reverse distance capped');
 tap('ArrowUp');tick(.3);check(c.stage===1&&c.speed===.85,'stop to crawl');
 tap('ArrowUp');tick(.3);check(c.stage===2&&c.speed===5,'crawl to standard');
 tap('ArrowUp');tick(.3);check(c.stage===3&&c.speed===8,'standard to high / cap');
 tap('ArrowUp');tick(.3);check(c.speed===8,'maximum speed');
 tap('ArrowDown');tick(.3);tap('ArrowDown');tick(.3);
 const final=p.position.clone(),heading=c.heading;tap('KeyE');tick(.7);
 check(c.mode==='walk'&&target.visible&&target.position.equals(original)&&target.quaternion.equals(rotation),'restore original car');
 check(p.position.distanceTo(final)<1e-7&&p.tanuki.rotation.y===heading,'tanuki inherits position and heading');
 key('keydown','ArrowUp');tick(.5);key('keyup','ArrowUp');check(Math.abs(p.position.distanceTo(final)-1.5)<.03,'walking unchanged');
}
document.querySelector('#result').textContent=out.join('\n')+'\nALL PASS';
if(location.search){
 approach();key('keydown','KeyE');tick(.66);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
 scene.background=new THREE.Color(0xe6e8e6);scene.add(new THREE.HemisphereLight(0xf4f8ff,0xb5ada0,2.2));const sun=new THREE.DirectionalLight(0xfff5e7,3);sun.position.set(-15,30,20);scene.add(sun);
 document.querySelector('#result').style.display='none';document.body.style.margin='0';document.body.append(renderer.domElement);rig.resize(innerWidth,innerHeight);
 let previous;renderer.setAnimationLoop(time=>{const dt=previous===undefined?0:Math.min((time-previous)/1000,.05);previous=time;p.update(dt);c.update(dt);rig.follow(p.position,dt,c.mode!=='walk');renderer.render(scene,rig.camera);});
}

}catch(e){document.querySelector('#result').textContent=out.join('\n')+'\nFAIL '+e.stack;}
</script></html>
