<!doctype html><html lang="ja"><meta charset="utf-8"><title>変身・手動運転 検証</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<pre id="result">検証中</pre><script type="module">
import * as THREE from 'three';
import {createWorld} from '../src/map/world.js';
import {createCity} from '../src/map/city.js';
import {createPlayer} from '../src/player/player.js';
import {createCamera} from '../src/camera.js';
import {createCarTransformation} from '../src/player/car-transformation.js';
const out=[],check=(ok,label)=>{if(!ok)throw Error(label);out.push('PASS '+label);};
try{
const scene=new THREE.Scene();createWorld(scene);const city=await createCity(scene),rig=createCamera(),p=await createPlayer(scene,rig.camera),target=city.volumes.deck.source.sedan.placement;
const original=target.position.clone(),rotation=target.quaternion.clone(),c=createCarTransformation(scene,p,rig.camera,target);
const key=(type,code)=>window.dispatchEvent(new KeyboardEvent(type,{code,key:code.startsWith('Arrow')?code:code.slice(3).toLowerCase()}));
const tick=(seconds)=>{for(let t=0;t<seconds;t+=.01){p.update(.01);c.update(.01);}};
const approach=()=>{const b=new THREE.Box3().setFromObject(target,true),v=b.getCenter(new THREE.Vector3());v.z=b.max.z+.7;p.setPosition(v);tick(.01);};
const count=()=>{let n=0;scene.traverse(()=>n++);return n;};const initialCount=count();
for(let cycle=0;cycle<3;cycle++){
approach();check(c.discover.visible,'nearby prompt '+cycle);key('keydown','KeyE');tick(.8);check(c.mode==='car'&&c.car.visible&&!target.visible,'transform '+cycle);
const h=c.heading;key('keydown','KeyA');tick(.4);key('keyup','KeyA');check(c.heading===h,'no stationary spin');
const start=p.position.clone();key('keydown','KeyW');tick(1.6);key('keydown','KeyA');tick(.4);key('keyup','KeyA');key('keyup','KeyW');check(c.speed>4.8&&p.position.distanceTo(start)>2,'acceleration and steering');
key('keydown','KeyE');check(c.mode==='car','moving exit blocked');const s=c.speed;tick(.1);check(c.speed>0&&c.speed<s,'coasting');
key('keydown','KeyS');tick(1.7);key('keyup','KeyS');check(c.speed<0,'braking and reverse');tick(2);
check(c.revert.visible,'stopped return prompt');const stopped=p.position.clone();key('keydown','KeyE');tick(.8);
check(c.mode==='walk'&&!c.car.visible&&target.visible&&target.position.equals(original)&&target.quaternion.equals(rotation),'original car restored');check(p.position.distanceTo(stopped)<.001,'return at stop position');
key('keydown','ArrowUp');tick(.5);key('keyup','ArrowUp');check(Math.abs(p.position.distanceTo(stopped)-1.5)<.03,'walking speed preserved');
check(count()===initialCount,'no objects accumulated');
}
p.setPosition(new THREE.Vector3(0,0,0));tick(1);check(!c.discover.visible&&Math.abs(rig.camera.zoom-1)<.001,'out of range and camera restored');
let source;p.model.traverse(o=>{if(o.name.startsWith('Leaf_CTRL_'))source=o;});check(c.leaf.children[0].geometry===source.children[0].geometry&&c.leaf.children[0].material===source.children[0].material,'authored leaf shared');
document.querySelector('#result').textContent=out.join('\n');
if(location.search){
 approach();if(location.search.includes('car')){key('keydown','KeyE');tick(.8);}
 p.setPosition(new THREE.Vector3(1,0,16.3));c.car.position.set(1,0,16.3);c.revert.position.set(1,1.8,16.3);c.discover.position.set(1,p.height+.65,16.3); const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
 document.querySelector('#result').style.display='none';document.body.style.margin='0';document.body.append(renderer.domElement);
 scene.background=new THREE.Color(0xe6e8e6);scene.add(new THREE.HemisphereLight(0xf4f8ff,0xb5ada0,2.2));const sun=new THREE.DirectionalLight(0xfff5e7,3);sun.position.set(-15,30,20);scene.add(sun);rig.resize(innerWidth,innerHeight);rig.follow(p.position);renderer.render(scene,rig.camera);
}
}catch(e){document.querySelector('#result').textContent=out.join('\n')+'\nFAIL '+e.stack;}
</script></html>
