<!doctype html><meta charset="utf-8"><title>オープニング確認</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><pre id="result">確認中</pre><script type="module">
import * as THREE from 'three';import {createWorld} from '../src/map/world.js';import {createCity} from '../src/map/city.js';import {createPlayer} from '../src/player/player.js';import {createCamera} from '../src/camera.js';import {createOpening} from '../src/player/opening.js';import {createCarTransformation} from '../src/player/car-transformation.js';import {createSupportArrival} from '../src/player/support-arrival.js';
try{const out=[],check=(ok,s)=>{if(!ok)throw Error(s);out.push('PASS '+s);};const scene=new THREE.Scene();createWorld(scene);const city=await createCity(scene),rig=createCamera(),p=await createPlayer(scene,rig.camera),spawn=p.position.clone(),initialRotation=p.tanuki.quaternion.clone(),q=rig.camera.quaternion.clone(),car=createCarTransformation(scene,p,rig.camera,city.volumes.deck.source.sedan.placement),opening=createOpening(p,rig,city.root.getObjectByName('station'),city.viaduct.trains.horizontal),arrival=createSupportArrival(scene,p,rig.camera,city.root.getObjectByName('support'),car);
const tick=t=>{for(let left=t;left>1e-8;left-=.02){const dt=Math.min(.02,left);p.update(dt);city.viaduct.trains.vertical.update(dt);opening.update(dt);if(!opening.active){city.viaduct.trains.horizontal.update(dt);car.update(dt);arrival.update(dt);rig.follow(p.position);}check(rig.camera.quaternion.angleTo(q)<1e-6,'camera orientation maintained');out.pop();}};
const key=(type,key,code)=>window.dispatchEvent(new KeyboardEvent(type,{key,code}));
scene.background=new THREE.Color(0xe6e8e6);scene.add(new THREE.HemisphereLight(0xf4f8ff,0xb5ada0,2.2));const sun=new THREE.DirectionalLight(0xfff5e7,3);sun.position.set(-15,30,20);scene.add(sun);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(550,380);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;rig.resize(550,380);
function snap(label){renderer.render(scene,rig.camera);const div=document.createElement('div'),canvas=document.createElement('canvas');div.style.display='inline-block';div.append(label);canvas.width=550;canvas.height=380;canvas.getContext('2d').drawImage(renderer.domElement,0,0);div.append(canvas);document.body.append(div);}
check(city.viaduct.trains.horizontal.root.position.x>0,'train starts on far side');check(!p.model.parent.visible,'avatar hidden before arrival');snap('電車到着前');key('keydown','ArrowUp','ArrowUp');key('keydown','e','KeyE');tick(2);check(p.position.distanceTo(opening.inside)<1e-7&&car.mode==='walk','movement and E blocked');tick(3.1);check(Math.abs(city.viaduct.trains.horizontal.root.position.x)<1e-7,'train stopped at station crossing');snap('駅中央に停止');tick(1.7);check(opening.state==='walk','arrival pause and camera pan precede exit');snap('入口から出発');tick(.65);snap('入口を歩いて出る');tick(6);check(!opening.active&&p.position.distanceTo(spawn)<1e-6,'original spawn restored / control enabled');check(p.tanuki.quaternion.angleTo(initialRotation)<1e-7,'original pre-opening orientation restored');check(p.model.parent.visible,'avatar visible');const expected=createCamera();expected.follow(spawn);check(rig.camera.position.distanceTo(expected.camera.position)<1e-6,'ordinary camera restored');snap('通常プレイ開始');key('keyup','ArrowUp','ArrowUp');key('keydown','ArrowRight','ArrowRight');tick(.2);key('keyup','ArrowRight','ArrowRight');check(p.position.distanceTo(spawn)>.5,'normal walking works after opening');check(city.viaduct.trains.horizontal.root.position.x<-.1,'train restarts toward near side after opening');const trainX=city.viaduct.trains.horizontal.root.position.x;tick(2);check(city.viaduct.trains.horizontal.root.position.x<trainX,'horizontal train keeps running');document.querySelector('#result').textContent=out.join('\n');}catch(e){document.querySelector('#result').textContent='FAIL '+e.stack;}
</script>
