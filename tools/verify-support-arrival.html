<!doctype html><meta charset="utf-8"><title>到着演出確認</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><pre id="result">確認中</pre><script type="module">
import * as THREE from 'three';import {createWorld} from '../src/map/world.js';import {createCity} from '../src/map/city.js';import {createPlayer} from '../src/player/player.js';import {createCamera} from '../src/camera.js';import {createCarTransformation} from '../src/player/car-transformation.js';import {createSupportArrival} from '../src/player/support-arrival.js';
try{
const out=[],check=(ok,label)=>{if(!ok)throw Error(label);out.push('PASS '+label);};
const scene=new THREE.Scene();createWorld(scene);const city=await createCity(scene),rig=createCamera(),p=await createPlayer(scene,rig.camera),car=createCarTransformation(scene,p,rig.camera,city.volumes.deck.source.sedan.placement),arrival=createSupportArrival(scene,p,rig.camera,city.root.getObjectByName('support'),car);
const head=p.model.getObjectByName('Head_CTRL_頭全体'),arm=p.model.getObjectByName('Arm_CTRL_腕_R'),headRest=head.quaternion.clone(),armRest=arm.quaternion.clone();
const tick=t=>{for(let left=t;left>1e-8;left-=.02){const dt=Math.min(.02,left);p.update(dt);if(!arrival.active)car.update(dt);arrival.update(dt);if(!arrival.active)rig.follow(p.position,dt,car.mode!=='walk');}};
const key=code=>window.dispatchEvent(new KeyboardEvent('keydown',{key:code==='KeyE'?'e':code,code}));
p.setPosition(arrival.mouth);tick(.02);check(arrival.prompt.visible,'entry prompt');
const cameraPosition=rig.camera.position.clone(),cameraRotation=rig.camera.quaternion.clone();
scene.background=new THREE.Color(0xe6e8e6);scene.add(new THREE.HemisphereLight(0xf4f8ff,0xb5ada0,2.2));const sun=new THREE.DirectionalLight(0xfff5e7,3);sun.position.set(-15,30,20);scene.add(sun);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(500,400);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;rig.resize(500,400);
function snap(label){renderer.render(scene,rig.camera);const div=document.createElement('div'),canvas=document.createElement('canvas');div.style.display='inline-block';div.textContent=label;canvas.width=500;canvas.height=400;canvas.getContext('2d').drawImage(renderer.domElement,0,0);div.append(canvas);document.body.append(div);}
snap('入口前');key('KeyE');const before=p.position.clone();key('ArrowUp');tick(.3);check(head.quaternion.angleTo(headRest)<1e-7&&arrival.state==='face','head stays neutral during body turn');tick(.3);check(arm.quaternion.angleTo(armRest)<1e-7&&arrival.state==='look','head lift starts after turn, before waving');tick(.9);check(arrival.state==='wave'&&!arrival.prompt.visible&&p.position.distanceTo(before)<1e-7,'E starts / walking locked');tick(.2);check(head.quaternion.angleTo(headRest)>.4&&arm.quaternion.angleTo(armRest)>1,'head looks up / original arm waves');snap('見上げて手を振る');
tick(1.6);snap('入口へ向き直る');tick(3);check(arrival.state==='hidden'||arrival.state==='fade','physically walks behind wall');check(p.tanuki.visible&&p.position.x>city.root.getObjectByName('support').position.x,'no visibility toggle');
scene.updateMatrixWorld(true);const point=head.getWorldPosition(new THREE.Vector3()),ray=new THREE.Raycaster(rig.camera.position,point.clone().sub(rig.camera.position).normalize());const wall=city.root.getObjectByName('support-entrance-screen-wall');check(ray.intersectObject(wall).some(hit=>hit.distance<rig.camera.position.distanceTo(point)),'screen wall occludes head from fixed camera');snap('壁の奥');
tick(3);check(arrival.state==='done'&&arrival.fade.style.opacity==='1','smooth fade ends in black');const end=p.position.clone();key('ArrowDown');key('KeyE');tick(.2);check(p.position.distanceTo(end)<1e-7,'black ending stays locked');check(rig.camera.position.equals(cameraPosition)&&rig.camera.quaternion.angleTo(cameraRotation)<1e-7,'camera unchanged throughout');
arrival.fade.style.display='none';document.querySelector('#result').textContent=out.join('\n');
}catch(e){document.querySelector('#result').textContent='FAIL '+e.stack;document.querySelectorAll('[aria-hidden]').forEach(e=>e.style.display='none');}
</script>
